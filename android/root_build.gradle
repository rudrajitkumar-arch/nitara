// ✅ FIXED: Removed old buildscript{} block that was overriding settings.gradle
// Plugin versions are now managed exclusively in settings.gradle (new DSL)

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
